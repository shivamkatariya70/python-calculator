<!DOCTYPE html>
<html>
<head>
    <title>Python Calculator</title>
    <style>
        body { font-family: Arial; display: flex; justify-content: center; margin-top: 80px; background: #222; color: white; }
        .box { background: #333; padding: 25px; border-radius: 10px; width: 300px; text-align: center; }
        input, select, button { width: 90%; padding: 10px; margin: 8px 0; font-size: 16px; border-radius: 5px; border: none; }
        button { background: #00b894; color: white; font-weight: bold; cursor: pointer; }
        h2 { color: #00cec9; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Python Calculator</h2>
        <form method="POST">
            <input type="number" step="any" name="num1" placeholder="Pehla Number dalein" required>
            <select name="operation">
                <option value="add">+ (Plus)</option>
                <option value="subtract">- (Minus)</option>
                <option value="multiply">× (Multiply)</option>
                <option value="divide">÷ (Divide)</option>
            </select>
            <input type="number" step="any" name="num2" placeholder="Doosra Number dalein" required>
            <button type="submit">Calculate Karo</button>
        </form>

        {% if result is not none %}
            <h3>Answer: {{ result }}</h3>
        {% endif %}
    </div>
</body>
</html>
